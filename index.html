<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Desktop Collection - IGotVD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --accent: #f093fb;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-muted: #b8b8d1;
            --text-dim: #888;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        .top-nav {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .nav-logo {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .nav-search {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 1.2em;
        }

        .clear-search.visible {
            opacity: 0.7;
        }

        .clear-search:hover {
            opacity: 1;
        }

        .nav-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
        }

        .stat-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .stat-badge .number {
            font-weight: bold;
            color: var(--primary);
        }

        /* Container Layout */
        .container {
            display: flex;
            max-width: 1800px;
            margin: 0 auto;
            gap: 30px;
            padding: 30px;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-list {
            list-style: none;
        }

        .tab-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .tab-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .tab-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text);
            font-weight: bold;
        }

        .tab-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .tab-item.active .tab-count {
            background: rgba(255, 255, 255, 0.2);
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            font-size: 0.9em;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
        }

        .theme-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .theme-tag {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-muted);
        }

        .theme-tag:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-tag.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
        }

        .sort-select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9em;
            cursor: pointer;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        /* Desktop Grid */
        .desktop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .desktop-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .desktop-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .desktop-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .desktop-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .card-icon {
            font-size: 3em;
            filter: drop-shadow(0 0 15px currentColor);
            transition: all 0.4s;
        }

        .desktop-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .favorite-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
            z-index: 10;
        }

        .favorite-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .favorite-btn.active {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-color: #fbbf24;
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
        }

        .card-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text);
        }

        .card-theme {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid var(--primary);
            border-radius: 15px;
            font-size: 0.75em;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-description {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .card-features {
            list-style: none;
            margin-bottom: 15px;
            max-height: 100px;
            overflow: hidden;
        }

        .card-features li {
            padding: 4px 0;
            color: var(--text-dim);
            font-size: 0.85em;
        }

        .card-features li::before {
            content: '✓ ';
            color: var(--success);
            font-weight: bold;
            margin-right: 6px;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.8em;
            color: var(--text-dim);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-dim);
        }

        .empty-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .empty-text {
            font-size: 1em;
            line-height: 1.6;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 100px 40px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Floating particles background */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float linear infinite;
            z-index: -1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                position: static;
                display: flex;
                gap: 15px;
                overflow-x: auto;
            }

            .sidebar-section {
                min-width: 250px;
                margin-bottom: 0;
            }

            .desktop-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .top-nav {
                padding: 15px;
                gap: 15px;
            }

            .nav-logo {
                font-size: 1.4em;
            }

            .nav-stats {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        @media (max-width: 640px) {
            .desktop-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.5em;
            }

            .stat-badge {
                font-size: 0.8em;
                padding: 6px 12px;
            }
        }

        /* Theme-specific colors */
        .card-cyber { border-color: rgba(0, 255, 65, 0.3); }
        .card-cyber:hover { box-shadow: 0 20px 60px rgba(0, 255, 65, 0.3); }
        .card-cyber .card-icon { color: #00ff41; }
        .card-cyber .card-theme { background: rgba(0, 255, 65, 0.2); border-color: #00ff41; color: #00ff41; }

        .card-neural { border-color: rgba(179, 102, 255, 0.3); }
        .card-neural:hover { box-shadow: 0 20px 60px rgba(179, 102, 255, 0.3); }
        .card-neural .card-icon { color: #b366ff; }
        .card-neural .card-theme { background: rgba(179, 102, 255, 0.2); border-color: #b366ff; color: #b366ff; }

        .card-quantum { border-color: rgba(0, 255, 255, 0.3); }
        .card-quantum:hover { box-shadow: 0 20px 60px rgba(0, 255, 255, 0.3); }
        .card-quantum .card-icon { color: #00ffff; }
        .card-quantum .card-theme { background: rgba(0, 255, 255, 0.2); border-color: #00ffff; color: #00ffff; }

        .card-retro { border-color: rgba(255, 0, 255, 0.3); }
        .card-retro:hover { box-shadow: 0 20px 60px rgba(255, 0, 255, 0.3); }
        .card-retro .card-icon { color: #ff00ff; }
        .card-retro .card-theme { background: rgba(255, 0, 255, 0.2); border-color: #ff00ff; color: #ff00ff; }

        .card-space { border-color: rgba(0, 170, 255, 0.3); }
        .card-space:hover { box-shadow: 0 20px 60px rgba(0, 170, 255, 0.3); }
        .card-space .card-icon { color: #00aaff; }
        .card-space .card-theme { background: rgba(0, 170, 255, 0.2); border-color: #00aaff; color: #00aaff; }

        .card-urban { border-color: rgba(255, 20, 147, 0.3); }
        .card-urban:hover { box-shadow: 0 20px 60px rgba(255, 20, 147, 0.3); }
        .card-urban .card-icon { color: #ff1493; }
        .card-urban .card-theme { background: rgba(255, 20, 147, 0.2); border-color: #ff1493; color: #ff1493; }

        .card-ocean { border-color: rgba(0, 191, 255, 0.3); }
        .card-ocean:hover { box-shadow: 0 20px 60px rgba(0, 191, 255, 0.3); }
        .card-ocean .card-icon { color: #00bfff; }
        .card-ocean .card-theme { background: rgba(0, 191, 255, 0.2); border-color: #00bfff; color: #00bfff; }

        .card-magic { border-color: rgba(138, 43, 226, 0.3); }
        .card-magic:hover { box-shadow: 0 20px 60px rgba(138, 43, 226, 0.3); }
        .card-magic .card-icon { color: #8a2be2; }
        .card-magic .card-theme { background: rgba(138, 43, 226, 0.2); border-color: #8a2be2; color: #8a2be2; }

        .card-biotech { border-color: rgba(0, 255, 136, 0.3); }
        .card-biotech:hover { box-shadow: 0 20px 60px rgba(0, 255, 136, 0.3); }
        .card-biotech .card-icon { color: #00ff88; }
        .card-biotech .card-theme { background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #00ff88; }

        .card-hacker { border-color: rgba(0, 255, 65, 0.3); }
        .card-hacker:hover { box-shadow: 0 20px 60px rgba(0, 255, 65, 0.3); }
        .card-hacker .card-icon { color: #00ff41; }
        .card-hacker .card-theme { background: rgba(0, 255, 65, 0.2); border-color: #00ff41; color: #00ff41; }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-logo">
            <span>🖥️</span>
            <span>IGotVD</span>
        </div>

        <div class="nav-search">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search desktops by name, theme, or features..."
                autocomplete="off"
            >
            <button class="clear-search" id="clearSearch">✕</button>
        </div>

        <div class="nav-stats">
            <div class="stat-badge" id="totalStat" title="Total Desktops">
                <span>🖥️</span>
                <span class="number" id="totalCount">0</span>
            </div>
            <div class="stat-badge" id="favoritesStat" title="Your Favorites">
                <span>⭐</span>
                <span class="number" id="favoritesCount">0</span>
            </div>
            <div class="stat-badge" id="recentStat" title="Recently Viewed">
                <span>🕒</span>
                <span class="number" id="recentCount">0</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- View Tabs -->
            <div class="sidebar-section">
                <div class="sidebar-title">📑 Views</div>
                <ul class="tab-list">
                    <li class="tab-item active" data-tab="all">
                        <span>All Desktops</span>
                        <span class="tab-count" id="allCount">0</span>
                    </li>
                    <li class="tab-item" data-tab="favorites">
                        <span>⭐ Favorites</span>
                        <span class="tab-count" id="favCount">0</span>
                    </li>
                    <li class="tab-item" data-tab="recent">
                        <span>🕒 Recent</span>
                        <span class="tab-count" id="recCount">0</span>
                    </li>
                </ul>
            </div>

            <!-- Theme Filter -->
            <div class="sidebar-section">
                <div class="sidebar-title">🎨 Themes</div>
                <div class="filter-group">
                    <div class="theme-filter" id="themeFilter">
                        <!-- Theme tags will be generated here -->
                    </div>
                </div>
            </div>

            <!-- Sort Options -->
            <div class="sidebar-section">
                <div class="sidebar-title">🔀 Sort By</div>
                <select class="sort-select" id="sortSelect">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="theme-asc">Theme (A-Z)</option>
                    <option value="recent">Recently Viewed</option>
                </select>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="section-header">
                <h1 class="section-title" id="sectionTitle">All Virtual Desktops</h1>
                <p class="section-subtitle" id="sectionSubtitle">Explore browser-based operating systems and workspaces</p>
            </div>

            <!-- Desktop Grid -->
            <div class="desktop-grid" id="desktopGrid">
                <div class="loading">
                    <div class="loader"></div>
                    <p style="color: var(--text-muted);">Loading virtual desktops...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Load Scripts -->
    <script src="src/js/static-api.js"></script>
    <script src="src/js/index.js"></script>
</body>
</html>
