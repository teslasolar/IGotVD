name: Update Desktop Manifest

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - '**.html'
      - '!index.html'
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate desktop manifest
        run: node generate-manifest.js

      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet desktops.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to manifest"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manifest updated"
          fi

      - name: Commit and push if changed
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add desktops.json
          git commit -m "🤖 Auto-update desktop manifest [skip ci]"
          git push
